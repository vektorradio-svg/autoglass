<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0B0E1A;--sf:#141828;--s2:#1C2235;
  --bd:rgba(255,255,255,0.07);
  --blue:#3D8EF0;--green:#3DD68C;--yel:#F0B429;--red:#F05252;
  --tx:#E8EDF8;--sub:#5A6480;
}
body{background:var(--bg);font-family:'Nunito',sans-serif;color:var(--tx);min-height:100vh;}
.hidden{display:none!important;}
/* LOGIN */
#ls{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.li{width:72px;height:72px;background:linear-gradient(135deg,#3D8EF0,#2060C0);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px;box-shadow:0 12px 32px rgba(61,142,240,0.35);}
.lb{font-size:24px;font-weight:900;text-align:center;margin-bottom:4px;}
.lb span{color:var(--blue);}
.lt{font-size:11px;color:var(--sub);letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:32px;}
.lc{background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:28px 24px;width:100%;max-width:360px;}
.lbl{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--sub);margin-bottom:8px;display:block;}
.inp{width:100%;background:var(--s2);border:1.5px solid var(--bd);border-radius:12px;padding:13px 16px;color:var(--tx);font-family:'Nunito',sans-serif;font-size:15px;outline:none;margin-bottom:16px;}
.inp:focus{border-color:var(--blue);}
.lbtn{width:100%;padding:15px;background:linear-gradient(135deg,#3D8EF0,#2060C0);border:none;border-radius:14px;color:#fff;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(61,142,240,0.4);}
.err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;font-weight:700;}
.hint{background:rgba(61,142,240,0.07);border:1px solid rgba(61,142,240,0.15);border-radius:12px;padding:12px 16px;margin-top:16px;width:100%;max-width:360px;}
.hr{font-size:12px;color:var(--sub);margin-bottom:3px;font-weight:600;}
/* APP */
#as{display:none;flex-direction:column;min-height:100vh;}
.hdr{padding:48px 20px 16px;display:flex;justify-content:space-between;align-items:center;}
.hg{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--sub);}
.ht{font-size:24px;font-weight:900;}
.logbtn{background:none;border:none;cursor:pointer;color:var(--sub);font-size:20px;padding:8px;}
/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(20,24,40,0.97);border-top:1px solid var(--bd);backdrop-filter:blur(20px);padding:8px 0 20px;display:flex;justify-content:space-around;z-index:100;}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 8px;background:none;border:none;color:var(--sub);font-family:'Nunito',sans-serif;font-size:10px;font-weight:700;position:relative;min-width:55px;}
.nb.active{color:var(--blue);}
.ni{font-size:20px;}
.ndot{position:absolute;top:0;right:6px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--bg);}
/* CONTENT */
#content{flex:1;padding-bottom:80px;overflow-y:auto;}
/* CARDS */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:18px;margin:0 16px 12px;}
.ct{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--sub);margin-bottom:14px;}
/* STATS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:12px;}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;}
.sc.full{grid-column:span 2;}
.sl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--sub);margin-bottom:6px;}
.sv{font-size:26px;font-weight:900;}
.sn{font-size:11px;color:var(--sub);margin-top:3px;font-weight:600;}
/* ALERTS */
.al{border-radius:14px;padding:12px 14px;margin:0 16px 10px;font-size:13px;font-weight:600;cursor:pointer;}
.al-r{background:rgba(240,82,82,0.1);border:1px solid rgba(240,82,82,0.2);color:var(--red);}
.al-y{background:rgba(240,180,41,0.1);border:1px solid rgba(240,180,41,0.2);color:var(--yel);}
.al-g{background:rgba(61,214,140,0.1);border:1px solid rgba(61,214,140,0.2);color:var(--green);}
/* ROWS */
.ir{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);}
.ir:last-child{border-bottom:none;}
.ii{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px;font-size:16px;}
.ib{flex:1;min-width:0;}
.in{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.is{font-size:11px;color:var(--sub);margin-top:2px;font-weight:600;}
.iright{text-align:right;flex-shrink:0;margin-left:8px;}
.ip{font-size:14px;font-weight:900;color:var(--green);}
/* BADGES */
.b{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;}
.bok{background:rgba(61,214,140,0.12);color:var(--green);border:1px solid rgba(61,214,140,0.25);}
.bwarn{background:rgba(240,180,41,0.12);color:var(--yel);border:1px solid rgba(240,180,41,0.25);}
.blow{background:rgba(240,82,82,0.12);color:var(--red);border:1px solid rgba(240,82,82,0.25);}
.bblue{background:rgba(61,142,240,0.12);color:var(--blue);border:1px solid rgba(61,142,240,0.25);}
/* SEARCH */
.sw{padding:0 16px;margin-bottom:10px;}
.si{width:100%;background:var(--sf);border:1.5px solid var(--bd);border-radius:14px;padding:11px 16px;color:var(--tx);font-family:'Nunito',sans-serif;font-size:14px;outline:none;}
.si:focus{border-color:var(--blue);}
/* FILTERS */
.fr{display:flex;gap:8px;padding:0 16px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
.fr::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--bd);background:transparent;color:var(--sub);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.chip.active{background:rgba(61,142,240,0.12);border-color:var(--blue);color:var(--blue);}
/* SECTION */
.sh{padding:6px 16px;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#3A4060;}
/* BUTTONS */
.btn{padding:11px 20px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;}
.bp{background:linear-gradient(135deg,#3D8EF0,#2060C0);color:#fff;box-shadow:0 4px 16px rgba(61,142,240,0.35);}
.bs{background:rgba(61,214,140,0.12);color:var(--green);border:1px solid rgba(61,214,140,0.25);}
.bd2{background:rgba(240,82,82,0.1);color:var(--red);border:1px solid rgba(240,82,82,0.2);}
.bf{width:100%;padding:15px;}
/* FAB */
.fab{position:fixed;bottom:88px;right:20px;width:56px;height:56px;background:linear-gradient(135deg,#3D8EF0,#2060C0);border:none;border-radius:18px;font-size:26px;color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(61,142,240,0.5);z-index:90;display:flex;align-items:center;justify-content:center;}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(4px);}
.ov.open{display:flex;}
.ms{width:100%;background:var(--sf);border-radius:24px 24px 0 0;padding:24px 20px 44px;border-top:1px solid var(--bd);max-height:88vh;overflow-y:auto;}
.mh{width:40px;height:4px;background:#3A4060;border-radius:2px;margin:0 auto 20px;}
.mt{font-size:18px;font-weight:900;margin-bottom:20px;}
.fg{margin-bottom:14px;}
.fsel{width:100%;background:var(--s2);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--tx);font-family:'Nunito',sans-serif;font-size:14px;outline:none;}
/* STEPPER */
.stp{display:flex;align-items:center;gap:10px;background:var(--s2);border:1.5px solid var(--bd);border-radius:12px;padding:4px;}
.stb{width:38px;height:38px;border-radius:10px;border:none;background:var(--sf);color:var(--tx);font-size:22px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.stv{flex:1;text-align:center;font-size:18px;font-weight:900;}
/* TOTAL */
.tb{background:rgba(61,142,240,0.08);border:1px solid rgba(61,142,240,0.2);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.tv{font-size:22px;font-weight:900;color:var(--blue);}
/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--sub);}
.ei{font-size:44px;margin-bottom:10px;opacity:.4;}
/* PROGRESS */
.pb{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;margin-top:8px;}
.pf{height:100%;border-radius:3px;background:linear-gradient(90deg,#3D8EF0,#2060C0);}
</style>

function renderStockList(){

function renderClientsList(){
  const list=clients.filter(c=>c.name.toLowerCase().includes(_cs.toLowerCase())||(c.phone&&c.phone.toLowerCase().includes(_cs.toLowerCase())));

  return list.map(c=>{
    const cSales=sales.filter(s=>s.clientId===c.id&&s.status!=='оплата');

// Load from Firebase and listen for realtime updates
function fbInit() {
  // Listen stock
  db.collection('stock').doc('main').onSnapshot(doc => {
    if(doc.exists) {
      const d = JSON.parse(doc.data().data);
      stock = d;
      localStorage.setItem('s', JSON.stringify(stock));
      if(ctab === 'stock' || ctab === 'home') showTab(ctab);
    }
  });
  // Listen sales
  db.collection('sales').doc('main').onSnapshot(doc => {
    if(doc.exists) {
      sales = JSON.parse(doc.data().data);
      localStorage.setItem('sa', JSON.stringify(sales));
      if(ctab === 'sales' || ctab === 'sell' || ctab === 'home' || ctab === 'history') showTab(ctab);
    }
  });
  // Listen requests
  db.collection('requests').doc('main').onSnapshot(doc => {
    if(doc.exists) {
      requests = JSON.parse(doc.data().data);
      localStorage.setItem('rq', JSON.stringify(requests));
      if(ctab === 'more' || ctab === 'reqs') showTab(ctab);
      buildNav();
    }
  });
  // Listen clients
  db.collection('expenses').doc('main').onSnapshot(doc => {
    if(doc.exists) {
      expenses = JSON.parse(doc.data().data);
      localStorage.setItem('exp', JSON.stringify(expenses));
      if(ctab === 'expenses') showTab(ctab);
    }
  });
  db.collection('cash').doc('main').onSnapshot(doc => {
    if(doc.exists) {
      cashTransfers = JSON.parse(doc.data().data);
      localStorage.setItem('cash', JSON.stringify(cashTransfers));
      if(ctab === 'cash') showTab(ctab);
    }
  });
  db.collection('services').doc('main').onSnapshot(doc => {
    if(doc.exists) {
      services = JSON.parse(doc.data().data);
      localStorage.setItem('srv', JSON.stringify(services));
      if(ctab === 'services') showTab(ctab);
    }
  });
  db.collection('clients').doc('main').onSnapshot(doc => {
    if(doc.exists) {
      clients = JSON.parse(doc.data().data);
      localStorage.setItem('cl', JSON.stringify(clients));
      if(ctab === 'clients') showTab(ctab);
    }
  });
}

  const prf=rev-cost,mg=rev>0?((prf/rev)*100).toFixed(0):0;
  const low=stock.filter(i=>i.qty<=i.minQty);
  let h='';

  h+=`<div class="sg">
    <div class="sc full" style="border-color:rgba(61,142,240,0.25)">
      <div class="sl">Выручка за период</div>
      <div class="sv" style="color:#3D8EF0">${rev.toLocaleString('ru')} ₼</div>
      <div class="sn">${done.length} продаж завершено</div>
      <div class="pb"><div class="pf" style="width:70%"></div></div>
    </div>
    <div class="sc" style="border-color:rgba(61,214,140,0.2)">
      <div class="sl">Прибыль</div>
      <div class="sv" style="color:#3DD68C;font-size:20px">${prf.toLocaleString('ru')} ₼</div>
      <div class="sn">Маржа ${mg}%</div>
    </div>
    <div class="sc">
      <div class="sl">На складе</div>
      <div class="sv">${stock.reduce((a,i)=>a+i.qty,0)}</div>
      <div class="sn">ед. товара</div>
    </div>
  </div>`;
  if(sales.length){
    h+=`<div class="sh">Последние продажи</div><div class="card" style="padding:4px 18px">`;
    sales.slice(0,5).forEach(s=>{h+=`<div class="ir"><div class="ii" style="background:rgba(61,214,140,0.1)">🪟</div><div class="ib"><div class="in">${s.itemName}</div><div class="is">${s.client} · ${s.employee}</div></div><div class="iright"><div class="ip">${s.total.toLocaleString('ru')} ₼</div><div style="font-size:11px;color:var(--sub)">${s.date}</div></div></div>`;});
    h+=`</div>`;
  }
  return h;
}

function procSale(){
  const cl=document.getElementById('scl')?.value?.trim();
  if(!_si||!cl)return alert(cu.role==='employee'?'Məhsul seçin və müştəri göstərin':'Выберите товар и укажите клиента');
  if(_si.qty<_sq)return alert(cu.role==='employee'?'Məhsul kifayət deyil':'Недостаточно товара');
  const total=_si.price*_sq;
  const paid=_pt==='cash'?total:parseInt(document.getElementById('spaid')?.value||0);
  const debt=total-paid;
  let foundClient=clients.find(c=>c.name.toLowerCase()===cl.toLowerCase()||c.phone===cl);
  if(!foundClient){
    const nc={id:Date.now()+1,name:cl,phone:'',car:'',note:'',debt:0,createdAt:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})};
    clients.push(nc);foundClient=nc;
  }
  if(!foundClient.debt)foundClient.debt=0;
  foundClient.debt+=debt;
  clients=clients.map(c=>c.id===foundClient.id?foundClient:c);
  sales.unshift({id:Date.now(),date:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),
    itemId:_si.id,itemName:_si.name,qty:_sq,price:_si.price,total,paid,debt,
    payType:_pt,employee:cu.name,client:cl,clientId:foundClient.id,status:'завершена'});
  stock=stock.map(i=>i.id===_si.id?{...i,qty:i.qty-_sq}:i);
  _si=null;_sq=1;_pt='cash';sv();
  toast(debt>0?'Продажа оформлена! Долг: '+debt.toLocaleString('ru')+' ₼':'Продажа успешно оформлена!');
  showTab(ctab);
}

function rReports(){
  const now=new Date();
  const periods=[['today','Сегодня'],['week','Неделя'],['month','Месяц'],['all','Всё время'],['custom','📅 Период']];
  if(!window._rp) window._rp='month';
  if(!window._rd1) window._rd1='';
  if(!window._rd2) window._rd2='';
  const done=sales.filter(s=>{
    if(s.status!=='завершена') return false;
    const parts=s.date.split('.');
    if(parts.length<2) return true;
    const sDate=new Date(now.getFullYear(),parseInt(parts[1])-1,parseInt(parts[0]));
    if(window._rp==='today') return sDate.toDateString()===now.toDateString();
    if(window._rp==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return sDate>=w;}
    if(window._rp==='month'){const m=new Date(now);m.setMonth(m.getMonth()-1);return sDate>=m;}
    if(window._rp==='all') return true;
    if(window._rp==='custom'){
      const d1=window._rd1?new Date(window._rd1):null;
      const d2=window._rd2?new Date(window._rd2):null;
      if(d1&&sDate<d1) return false;
      if(d2){const d2e=new Date(d2);d2e.setDate(d2e.getDate()+1);if(sDate>=d2e) return false;}
      return true;
    }
    return true;
  });
  const rev=done.reduce((a,s)=>a+s.total,0);
  const cost=done.reduce((a,s)=>{const it=stock.find(i=>i.id===s.itemId);return a+(it?it.cost*s.qty:0);},0);
  const prf=rev-cost,mg=rev>0?((prf/rev)*100).toFixed(0):0,avg=done.length?Math.round(rev/done.length):0;
  const bE={},bT={};
  done.forEach(s=>{if(!bE[s.employee])bE[s.employee]={n:0,r:0};bE[s.employee].n++;bE[s.employee].r+=s.total;});
  done.forEach(s=>{const it=stock.find(i=>i.id===s.itemId);const t=it?.type||'Прочее';if(!bT[t])bT[t]={q:0,r:0};bT[t].q+=s.qty;bT[t].r+=s.total;});
  const mR=Math.max(...Object.values(bE).map(e=>e.r),1);
  let h=`<div class="sg">
    <div class="sc full" style="border-color:rgba(61,142,240,0.2)">
      <div class="sl">Выручка / Прибыль</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <div><div class="sv" style="color:#3D8EF0">${rev.toLocaleString('ru')} ₼</div><div class="sn">выручка</div></div>
        <div style="text-align:right"><div class="sv" style="color:#3DD68C;font-size:20px">${prf.toLocaleString('ru')} ₼</div><div class="sn">прибыль · ${mg}%</div></div>
      </div>
    </div>
    <div class="sc"><div class="sl">Продаж</div><div class="sv">${done.length}</div></div>
    <div class="sc" style="border-color:rgba(240,180,41,0.2)"><div class="sl">Ср. чек</div><div class="sv" style="color:#F0B429;font-size:20px">${avg.toLocaleString('ru')} ₼</div></div>
  </div>`;
  if(Object.keys(bE).length){
    h+=`<div class="sh">По сотрудникам</div><div class="card">`;
    Object.entries(bE).forEach(([nm,d])=>{h+=`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:14px;font-weight:700">${nm}</span><span style="font-size:14px;font-weight:900;color:#3DD68C">${d.r.toLocaleString('ru')} ₼</span></div><div style="display:flex;align-items:center;gap:8px"><div class="pb" style="flex:1"><div class="pf" style="width:${(d.r/mR*100).toFixed(0)}%;background:linear-gradient(90deg,#3D8EF0,#3DD68C)"></div></div><span style="font-size:11px;color:var(--sub);font-weight:700">${d.n} прод.</span></div></div>`;});
    h+=`</div>`;
  }
  if(Object.keys(bT).length){
    h+=`<div class="sh">По категориям</div><div class="card" style="padding:4px 18px">`;
    Object.entries(bT).forEach(([t,d])=>{h+=`<div class="ir"><div class="ii" style="background:rgba(61,142,240,0.1)">📦</div><div class="ib"><div class="in">${t}</div><div class="is">${d.q} шт. продано</div></div><div class="iright"><div class="ip">${d.r.toLocaleString('ru')} ₼</div></div></div>`;});
    h+=`</div>`;
  }
  h+=`<div style="padding:0 16px;margin-bottom:80px">
    <div class="sh" style="padding:16px 0 10px">Выгрузка в Excel</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn bp bf" onclick="exportSales()">📥 Выгрузить продажи</button>

  return h;

function importExcel(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(!rows.length)return alert('Файл пустой или неправильный формат');
      
      // Try to detect columns automatically
      const firstRow=rows[0];
      const keys=Object.keys(firstRow);
      
      // Find name column
      const nameKey=keys.find(k=>k.toLowerCase().includes('наз')||k.toLowerCase().includes('name')||k.toLowerCase().includes('товар')||k.toLowerCase().includes('стекл'))||keys[0];
      // Find qty column  
      const qtyKey=keys.find(k=>k.toLowerCase().includes('кол')||k.toLowerCase().includes('qty')||k.toLowerCase().includes('остат')||k.toLowerCase().includes('количеств'))||keys[2];
      // Find brand
      const brandKey=keys.find(k=>k.toLowerCase().includes('марк')||k.toLowerCase().includes('brand')||k.toLowerCase().includes('авто'));
      // Find price
      const priceKey=keys.find(k=>k.toLowerCase().includes('цен')||k.toLowerCase().includes('price')||k.toLowerCase().includes('продаж'));
      // Find cost
      const costKey=keys.find(k=>k.toLowerCase().includes('себ')||k.toLowerCase().includes('cost')||k.toLowerCase().includes('закуп'));
      // Find type/category
      const typeKey=keys.find(k=>k.toLowerCase().includes('тип')||k.toLowerCase().includes('катег')||k.toLowerCase().includes('type'));
      
      let added=0, skipped=0;
      const newItems=[];
      
      rows.forEach(row=>{
        const name=String(row[nameKey]||'').trim();
        if(!name||name.length<2){skipped++;return;}
        const qty=parseInt(row[qtyKey])||0;
        const brand=brandKey?String(row[brandKey]||'').trim():name.split(' ')[0];
        const price=priceKey?parseFloat(row[priceKey])||0:0;
        const cost=costKey?parseFloat(row[costKey])||0:0;
        const type=typeKey?String(row[typeKey]||'').trim():'Импорт';
        
        // Check if item already exists
        const exists=stock.find(i=>i.name.toLowerCase()===name.toLowerCase());
        if(exists){
          // Update quantity
          stock=stock.map(i=>i.name.toLowerCase()===name.toLowerCase()?{...i,qty:i.qty+qty}:i);
        }else{
          newItems.push({
            id:Date.now()+added,
            name,sku:'IMP-'+String(Date.now()+added).slice(-6),
            brand,type,qty,minQty:2,price,cost
          });
        }
        added++;
      });
      
      stock=[...stock,...newItems];
      sv();
      input.value='';
      showTab('stock');
      toast('Импорт завершён! Добавлено: '+newItems.length+' новых, обновлено: '+(added-newItems.length));
    }catch(err){
      alert('Ошибка чтения файла: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

  function inExpPeriod(dateStr){
    if(!dateStr) return true;
    const parts=dateStr.split('.');
    if(parts.length<2) return true;
    const d=new Date(now.getFullYear(),parseInt(parts[1])-1,parseInt(parts[0]));
    if(window._ep==='today') return d.toDateString()===now.toDateString();

      <div style="display:flex;flex-direction:column;gap:8px">
        ${formTypes.map(tp=>`

// ── CASH ──────────────────────────────────────────────────────────────────────
function rCash(){
  const now=new Date();
  if(!window._cp) window._cp='today';
  if(!window._cd1) window._cd1='';
  if(!window._cd2) window._cd2='';
  const cashPeriods=[['today','Сегодня'],['week','Неделя'],['month','Месяц'],['all','Всё время'],['custom','📅 Период']];

  function inPeriod(dateStr){
    if(!dateStr) return true;
    const parts=dateStr.split('.');
    if(parts.length<2) return true;
    const d=new Date(now.getFullYear(),parseInt(parts[1])-1,parseInt(parts[0]));
    if(window._cp==='today') return d.toDateString()===now.toDateString();
    if(window._cp==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(window._cp==='month'){const m=new Date(now);m.setMonth(m.getMonth()-1);return d>=m;}
    if(window._cp==='all') return true;
    if(window._cp==='custom'){
      const d1=window._cd1?new Date(window._cd1):null;
      const d2=window._cd2?new Date(window._cd2):null;
      if(d1&&d<d1) return false;
      if(d2){const d2e=new Date(d2);d2e.setDate(d2e.getDate()+1);if(d>=d2e) return false;}
      return true;
    }
    return true;
  }

  // Calculate cash from sales and services filtered by period
  const allIncome=[...sales,...services].filter(s=>(s.status==='завершена'||s.status==='оплата'||s.price>0)&&inPeriod(s.date));
  const allTotal=allIncome.reduce((a,s)=>a+(s.total||s.price||0),0);
  
  // Transfers filtered by period
  const myTransfers = cu.role==='owner' ? cashTransfers.filter(t=>inPeriod(t.date)) : cashTransfers.filter(t=>t.employee===cu.name&&inPeriod(t.date));
  const myIncome = cu.role==='owner' ? allTotal : 
    allIncome.filter(s=>s.employee===cu.name).reduce((a,s)=>a+(s.total||s.price||0),0);
  const myTransferredTotal = myTransfers.reduce((a,t)=>a+t.amount,0);
  const myRemaining = myIncome - myTransferredTotal;

  let h=`<div class="fr" style="margin-bottom:10px">
    ${cashPeriods.map(([id,lb])=>`<button class="chip${window._cp===id?' active':''}" onclick="window._cp='${id}';showTab('cash')">${lb}</button>`).join('')}
  </div>
  ${window._cp==='custom'?`<div style="display:flex;gap:10px;padding:0 16px;margin-bottom:14px">
    <div style="flex:1"><div class="lbl" style="margin-bottom:6px">С даты</div>
      <input type="date" class="inp" style="margin-bottom:0;padding:10px 12px" value="${window._cd1||''}" onchange="window._cd1=this.value;showTab('cash')"/>
    </div>
    <div style="flex:1"><div class="lbl" style="margin-bottom:6px">По дату</div>
      <input type="date" class="inp" style="margin-bottom:0;padding:10px 12px" value="${window._cd2||''}" onchange="window._cd2=this.value;showTab('cash')"/>
    </div>
  </div>`:''}`;

  if(cu.role==='owner'){
    // Owner sees all cash
    const totalTransferred=cashTransfers.reduce((a,t)=>a+t.amount,0);
    const totalRemaining=allTotal-totalTransferred;
    
    h+=`<div class="sg">
      <div class="sc full" style="border-color:rgba(61,214,140,0.25)">
        <div class="sl">Всего в кассе (все время)</div>
        <div class="sv" style="color:#3DD68C">${allTotal.toLocaleString('ru')} ₼</div>
        <div class="sn">продажи + услуги</div>
      </div>
      <div class="sc" style="border-color:rgba(61,142,240,0.25)">
        <div class="sl">${t('Сдано директору')}</div>
        <div class="sv" style="color:#3D8EF0;font-size:20px">${totalTransferred.toLocaleString('ru')} ₼</div>
      </div>
      <div class="sc" style="border-color:rgba(240,180,41,0.25)">
        <div class="sl">Остаток в кассе</div>
        <div class="sv" style="color:#F0B429;font-size:20px">${totalRemaining.toLocaleString('ru')} ₼</div>
      </div>
    </div>`;

    // Per employee breakdown
    const empNames=[...new Set(cashTransfers.map(t=>t.employee)),...new Set(allIncome.map(s=>s.employee))].filter(Boolean);
    const uniqueEmps=[...new Set(empNames)];
    
    if(uniqueEmps.length){
      h+=`<div class="sh">По сотрудникам</div><div class="card" style="padding:4px 18px">`;
      uniqueEmps.forEach(emp=>{
        const empIncome=allIncome.filter(s=>s.employee===emp).reduce((a,s)=>a+(s.total||s.price||0),0);
        const empTransferred=cashTransfers.filter(t=>t.employee===emp).reduce((a,t)=>a+t.amount,0);
        const empRemaining=empIncome-empTransferred;
        h+=`<div class="ir">
          <div class="ii" style="background:rgba(61,142,240,0.1);font-size:18px">👤</div>
          <div class="ib">
            <div class="in">${emp}</div>
            <div class="is">Заработано: ${empIncome.toLocaleString('ru')} ₼</div>
          </div>
          <div class="iright">
            <div style="font-size:12px;color:#3DD68C;font-weight:700">Сдал: ${empTransferred.toLocaleString('ru')} ₼</div>
            <div style="font-size:12px;color:${empRemaining>0?'#F0B429':'#3DD68C'};font-weight:700">Остаток: ${empRemaining.toLocaleString('ru')} ₼</div>
          </div>
        </div>`;
      });
      h+=`</div>`;
    }
  } else {
    // Employee sees own cash
    h+=`<div class="sg">
      <div class="sc full" style="border-color:rgba(61,214,140,0.25)">
        <div class="sl">${t('Мои продажи (всего)')}</div>
        <div class="sv" style="color:#3DD68C">${myIncome.toLocaleString('ru')} ₼</div>
      </div>
      <div class="sc" style="border-color:rgba(61,142,240,0.25)">
        <div class="sl">${t('Сдано директору')}</div>
        <div class="sv" style="color:#3D8EF0;font-size:20px">${myTransferredTotal.toLocaleString('ru')} ₼</div>
      </div>
      <div class="sc" style="border-color:rgba(240,180,41,0.25)">
        <div class="sl">${t('У меня на руках')}</div>
        <div class="sv" style="color:#F0B429;font-size:20px">${myRemaining.toLocaleString('ru')} ₼</div>
      </div>
    </div>`;
    
    // Transfer button for employee
    h+=`<div class="card" style="border-color:rgba(61,214,140,0.2)">
      <div class="ct">${t('Сдать деньги директору')}</div>
      <div class="fg"><label class="lbl">Сумма (₼)</label>
        <input class="inp" id="cash-amt" type="number" placeholder="0" value="${myRemaining>0?myRemaining:''}"/>
      </div>
      <div class="fg"><label class="lbl">Заметка</label>
        <input class="inp" id="cash-note" placeholder="Необязательно"/>
      </div>
      <button class="btn bp bf" style="background:linear-gradient(135deg,#3DD68C,#2aa86a)" onclick="transferCash()">${t('💵 Сдать деньги')}</button>
    </div>`;
  }

  // Transfer history
  h+=`<div class="sh">${t('История сдач')}</div>`;
  if(!myTransfers.length){
    h+=`<div class="empty"><div class="ei">💵</div><div>${t('Сдач пока не было')}</div></div>`;
  } else {
    h+=`<div class="card" style="padding:4px 18px">`;
    myTransfers.slice(0,20).forEach(t=>{
      h+=`<div class="ir">
        <div class="ii" style="background:rgba(61,214,140,0.1);font-size:18px">💵</div>
        <div class="ib">
          <div class="in">${t.employee}</div>
          <div class="is">${t.date}${t.note?' · '+t.note:''}</div>
        </div>
        <div class="iright">
          <div class="ip">${t.amount.toLocaleString('ru')} ₼</div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }
  return h;
}

function transferCash(){
  const amount=parseInt(document.getElementById('cash-amt')?.value)||0;
  const note=document.getElementById('cash-note')?.value||'';
  if(amount<=0) return alert('Введите сумму');
  cashTransfers.unshift({
    id:Date.now(),
    date:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),
    employee:cu.name, amount, note
  });
  sv();
  toast('Сдано '+amount.toLocaleString('ru')+' ₼ директору!');
  showTab('cash');
}


// ── SERVICES ──────────────────────────────────────────────────────────────────
const SERVICE_TYPES = [
  {id:'film',    name:'Пленка на авто',      icon:'🎞️', price:0},
  {id:'lights',  name:'Чистка фар',          icon:'💡', price:0},
  {id:'interior',name:'Покраска руля/сидений',icon:'🎨', price:0},
];
let _svType='film', _svPrice=0, _svClient='';

function rServices(){
  let h=`<div class="card" style="border-color:rgba(61,142,240,0.2)">
    <div class="ct">${t('Оформить услугу')}</div>
    <div class="fg"><label class="lbl">Тип услуги</label>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${SERVICE_TYPES.map(s=>`
        <div onclick="window._svType='${s.id}';showTab('services')" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1.5px solid ${window._svType===s.id?'var(--blue)':'var(--bd)'};background:${window._svType===s.id?'rgba(61,142,240,0.08)':'transparent'};cursor:pointer">
          <span style="font-size:22px">${s.icon}</span>
          <span style="font-size:14px;font-weight:700;color:var(--tx)">${s.name}</span>
          ${window._svType===s.id?'<span style="margin-left:auto;color:var(--blue);font-size:18px">✓</span>':''}
        </div>`).join('')}
      </div>
    </div>
    <div class="fg"><label class="lbl">${t('Клиент / авто')}</label>
      <input class="inp" id="svc-client" placeholder="${t('Имя клиента или марка авто')}" list="cl-list2"/>
      <datalist id="cl-list2">${clients.map(c=>`<option value="${c.name}">`).join('')}</datalist>
    </div>
    <div class="fg"><label class="lbl">Цена (₼)</label>
      <input class="inp" id="svc-price" type="number" placeholder="0"/>
    </div>
    <div class="fg"><label class="lbl">Заметка (необязательно)</label>
      <input class="inp" id="svc-note" placeholder="Доп. информация..."/>
    </div>
    <button class="btn bp bf" onclick="addService()">${t('🔧 Оформить услугу')}</button>
  </div>`;

  h+=`<div class="sh">${t('История услуг')}</div>`;
  const myServices = cu.role==='owner' ? services : services.filter(s=>s.employee===cu.name);
  if(!myServices.length){
    h+=`<div class="empty"><div class="ei">🔧</div><div>${t('Услуг пока нет')}</div></div>`;
  } else {
    h+=`<div class="card" style="padding:4px 18px">`;
    myServices.slice(0,30).forEach(s=>{
      const st=SERVICE_TYPES.find(x=>x.id===s.type);
      h+=`<div class="ir">
        <div class="ii" style="background:rgba(61,142,240,0.1);font-size:18px">${st?.icon||'🔧'}</div>
        <div class="ib">
          <div class="in">${st?.name||s.type}</div>
          <div class="is">${s.client} · ${s.employee} · ${s.date}</div>
          ${s.note?`<div style="font-size:11px;color:var(--yel);margin-top:2px">${s.note}</div>`:''}
        </div>
        <div class="iright">
          <div class="ip">${s.price.toLocaleString('ru')} ₼</div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }
  return h;
}

function addService(){
  const client=document.getElementById('svc-client')?.value?.trim();
  const price=parseInt(document.getElementById('svc-price')?.value)||0;
  const note=document.getElementById('svc-note')?.value||'';
  if(!client) return alert(cu.role==='employee'?'Müştəri göstərin':'Укажите клиента');
  if(!window._svType) return alert('Выберите тип услуги');
  services.unshift({
    id:Date.now(),
    date:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),
    type:window._svType,
    client, price, note,
    employee:cu.name,
    status:'завершена'
  });
  // Add client if not exists
  const found=clients.find(c=>c.name.toLowerCase()===client.toLowerCase());
  if(!found){
    clients.push({id:Date.now()+1,name:client,phone:'',car:'',note:'',debt:0,
      createdAt:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})});
  }
  sv();
  toast('Услуга оформлена! '+price.toLocaleString('ru')+' ₼');
  showTab('services');
}


function openModal(){document.getElementById('ov').classList.add('open');}
function closeModal(e){if(!e||e.target===document.getElementById('ov'))document.getElementById('ov').classList.remove('open');}
function toast(msg){const a=document.createElement('div');a.className='al al-g';a.style.cssText='position:fixed;top:20px;left:16px;right:16px;z-index:300;font-size:14px';a.textContent='✅ '+msg;document.body.appendChild(a);setTimeout(()=>a.remove(),2500);}
</script>
