<html lang="ru">
<head>

<title>AutoGlass Pro</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0B0E1A;--sf:#141828;--s2:#1C2235;
  --bd:rgba(255,255,255,0.07);
  --blue:#3D8EF0;--green:#3DD68C;--yel:#F0B429;--red:#F05252;
  --tx:#E8EDF8;--sub:#5A6480;
}
body{background:var(--bg);font-family:'Nunito',sans-serif;color:var(--tx);min-height:100vh;}
.hidden{display:none!important;}
/* LOGIN */
#ls{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.li{width:72px;height:72px;background:linear-gradient(135deg,#3D8EF0,#2060C0);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px;box-shadow:0 12px 32px rgba(61,142,240,0.35);}
.lb{font-size:24px;font-weight:900;text-align:center;margin-bottom:4px;}
.lb span{color:var(--blue);}
.lt{font-size:11px;color:var(--sub);letter-spacing:3px;text-transform:uppercase;text-align:center;margin-bottom:32px;}
.lc{background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:28px 24px;width:100%;max-width:360px;}
.lbl{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--sub);margin-bottom:8px;display:block;}
.inp{width:100%;background:var(--s2);border:1.5px solid var(--bd);border-radius:12px;padding:13px 16px;color:var(--tx);font-family:'Nunito',sans-serif;font-size:15px;outline:none;margin-bottom:16px;}
.inp:focus{border-color:var(--blue);}
.lbtn{width:100%;padding:15px;background:linear-gradient(135deg,#3D8EF0,#2060C0);border:none;border-radius:14px;color:#fff;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(61,142,240,0.4);}
.err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;font-weight:700;}
.hint{background:rgba(61,142,240,0.07);border:1px solid rgba(61,142,240,0.15);border-radius:12px;padding:12px 16px;margin-top:16px;width:100%;max-width:360px;}
.hr{font-size:12px;color:var(--sub);margin-bottom:3px;font-weight:600;}
/* APP */
#as{display:none;flex-direction:column;min-height:100vh;}
.hdr{padding:48px 20px 16px;display:flex;justify-content:space-between;align-items:center;}
.hg{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--sub);}
.ht{font-size:24px;font-weight:900;}
.logbtn{background:none;border:none;cursor:pointer;color:var(--sub);font-size:20px;padding:8px;}
/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:rgba(20,24,40,0.97);border-top:1px solid var(--bd);backdrop-filter:blur(20px);padding:8px 0 20px;display:flex;justify-content:space-around;z-index:100;}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 8px;background:none;border:none;color:var(--sub);font-family:'Nunito',sans-serif;font-size:10px;font-weight:700;position:relative;min-width:55px;}
.nb.active{color:var(--blue);}
.ni{font-size:20px;}
.ndot{position:absolute;top:0;right:6px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid var(--bg);}
/* CONTENT */
#content{flex:1;padding-bottom:80px;overflow-y:auto;}
/* CARDS */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:18px;margin:0 16px 12px;}
.ct{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--sub);margin-bottom:14px;}
/* STATS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:12px;}
.sc{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;}
.sc.full{grid-column:span 2;}
.sl{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--sub);margin-bottom:6px;}
.sv{font-size:26px;font-weight:900;}
.sn{font-size:11px;color:var(--sub);margin-top:3px;font-weight:600;}
/* ALERTS */
.al{border-radius:14px;padding:12px 14px;margin:0 16px 10px;font-size:13px;font-weight:600;cursor:pointer;}
.al-r{background:rgba(240,82,82,0.1);border:1px solid rgba(240,82,82,0.2);color:var(--red);}
.al-y{background:rgba(240,180,41,0.1);border:1px solid rgba(240,180,41,0.2);color:var(--yel);}
.al-g{background:rgba(61,214,140,0.1);border:1px solid rgba(61,214,140,0.2);color:var(--green);}
/* ROWS */
.ir{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd);}
.ir:last-child{border-bottom:none;}
.ii{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:12px;font-size:16px;}
.ib{flex:1;min-width:0;}
.in{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.is{font-size:11px;color:var(--sub);margin-top:2px;font-weight:600;}
.iright{text-align:right;flex-shrink:0;margin-left:8px;}
.ip{font-size:14px;font-weight:900;color:var(--green);}
/* BADGES */
.b{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;}
.bok{background:rgba(61,214,140,0.12);color:var(--green);border:1px solid rgba(61,214,140,0.25);}
.bwarn{background:rgba(240,180,41,0.12);color:var(--yel);border:1px solid rgba(240,180,41,0.25);}
.blow{background:rgba(240,82,82,0.12);color:var(--red);border:1px solid rgba(240,82,82,0.25);}
.bblue{background:rgba(61,142,240,0.12);color:var(--blue);border:1px solid rgba(61,142,240,0.25);}
/* SEARCH */
.sw{padding:0 16px;margin-bottom:10px;}
.si{width:100%;background:var(--sf);border:1.5px solid var(--bd);border-radius:14px;padding:11px 16px;color:var(--tx);font-family:'Nunito',sans-serif;font-size:14px;outline:none;}
.si:focus{border-color:var(--blue);}
/* FILTERS */
.fr{display:flex;gap:8px;padding:0 16px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
.fr::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1.5px solid var(--bd);background:transparent;color:var(--sub);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.chip.active{background:rgba(61,142,240,0.12);border-color:var(--blue);color:var(--blue);}
/* SECTION */
.sh{padding:6px 16px;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#3A4060;}
/* BUTTONS */
.btn{padding:11px 20px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;}
.bp{background:linear-gradient(135deg,#3D8EF0,#2060C0);color:#fff;box-shadow:0 4px 16px rgba(61,142,240,0.35);}
.bs{background:rgba(61,214,140,0.12);color:var(--green);border:1px solid rgba(61,214,140,0.25);}
.bd2{background:rgba(240,82,82,0.1);color:var(--red);border:1px solid rgba(240,82,82,0.2);}
.bf{width:100%;padding:15px;}
/* FAB */
.fab{position:fixed;bottom:88px;right:20px;width:56px;height:56px;background:linear-gradient(135deg,#3D8EF0,#2060C0);border:none;border-radius:18px;font-size:26px;color:#fff;cursor:pointer;box-shadow:0 8px 24px rgba(61,142,240,0.5);z-index:90;display:flex;align-items:center;justify-content:center;}
/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(4px);}
.ov.open{display:flex;}
.ms{width:100%;background:var(--sf);border-radius:24px 24px 0 0;padding:24px 20px 44px;border-top:1px solid var(--bd);max-height:88vh;overflow-y:auto;}
.mh{width:40px;height:4px;background:#3A4060;border-radius:2px;margin:0 auto 20px;}
.mt{font-size:18px;font-weight:900;margin-bottom:20px;}
.fg{margin-bottom:14px;}
.fsel{width:100%;background:var(--s2);border:1.5px solid var(--bd);border-radius:12px;padding:12px 14px;color:var(--tx);font-family:'Nunito',sans-serif;font-size:14px;outline:none;}
/* STEPPER */
.stp{display:flex;align-items:center;gap:10px;background:var(--s2);border:1.5px solid var(--bd);border-radius:12px;padding:4px;}
.stb{width:38px;height:38px;border-radius:10px;border:none;background:var(--sf);color:var(--tx);font-size:22px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.stv{flex:1;text-align:center;font-size:18px;font-weight:900;}
/* TOTAL */
.tb{background:rgba(61,142,240,0.08);border:1px solid rgba(61,142,240,0.2);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}
.tv{font-size:22px;font-weight:900;color:var(--blue);}
/* EMPTY */
.empty{text-align:center;padding:48px 20px;color:var(--sub);}
.ei{font-size:44px;margin-bottom:10px;opacity:.4;}
/* PROGRESS */
.pb{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;margin-top:8px;}
.pf{height:100%;border-radius:3px;background:linear-gradient(90deg,#3D8EF0,#2060C0);}
</style>

</head>

function renderStockList(){
  const types=['Все','⚠️ Заканчивается','Fiolet','Xuqlar','Xuqlar Sadə','Germetik'];
  const list=stock.filter(i=>{const matchType=_sf==='Все'||((_sf==='⚠️ Заканчивается')?i.qty<=i.minQty:i.type===_sf);const matchSearch=i.name.toLowerCase().includes(_st.toLowerCase())||i.brand.toLowerCase().includes(_st.toLowerCase());return matchType&&matchSearch;}).sort((a,b)=>a.brand.localeCompare(b.brand,'az'));
  if(!list.length)return`<div class="empty"><div class="ei">📦</div><div>${t('Ничего не найдено')}</div></div>`;
  return list.map(item=>{
    const st=item.qty===0?'blow':item.qty<=item.minQty?'bwarn':'bok';
    const cl=cu.role==='owner'?`onclick="openItemModal(${item.id})" style="cursor:pointer"`:'';
    return`<div class="ir" ${cl}><div class="ii" style="background:${item.qty<=item.minQty?'rgba(240,82,82,0.12)':'rgba(61,142,240,0.1)'}">${item.qty<=item.minQty?'⚠️':'🪟'}</div><div class="ib"><div class="in">${item.name}</div></div><div class="iright"><span class="b ${st}">${item.qty} шт.</span>${cu.role==='owner'?`<div style="font-size:11px;color:var(--sub);margin-top:3px">${item.price?item.price.toLocaleString('ru')+' ₼':'—'}</div>`:''}</div></div>`;
  }).join('');
}

function renderClientsList(){
  const list=clients.filter(c=>c.name.toLowerCase().includes(_cs.toLowerCase())||(c.phone&&c.phone.toLowerCase().includes(_cs.toLowerCase())));
  if(!list.length)return`<div class="empty"><div class="ei">👥</div><div>${clients.length===0?'Нет клиентов':'Ничего не найдено'}</div></div>`;
  return list.map(c=>{
    const cSales=sales.filter(s=>s.clientId===c.id&&s.status!=='оплата');
    const total=cSales.reduce((a,s)=>a+s.total,0);
    const debt=c.debt||0;
    return`<div class="ir" onclick="openClientModal(${c.id})" style="cursor:pointer">
      <div class="ii" style="background:${debt>0?'rgba(240,82,82,0.15)':'rgba(61,142,240,0.1)'};font-size:20px">${debt>0?'⚠️':'👤'}</div>
      <div class="ib"><div class="in">${c.name}</div><div class="is">${c.phone||'—'} · ${c.car||'—'}</div></div>
      <div class="iright">${debt>0?`<div style="font-size:13px;font-weight:900;color:#F05252">${debt.toLocaleString('ru')} ₼ долг</div>`:`<div class="ip">${total?total.toLocaleString('ru')+' ₼':'—'}</div>`}
      <div style="font-size:11px;color:var(--sub)">${cSales.length} покупок</div></div>
    </div>`;
  }).join('');
}

function fbSave(collection, data) {
  if(collection==='stock') _stockSaving=true;
  db.collection(collection).doc('main').set({data: JSON.stringify(data), updated: Date.now()})
    .then(()=>{ if(collection==='stock') setTimeout(()=>{_stockSaving=false;},3000); })

function deleteSale(id){
  if(!confirm('Удалить продажу?')) return;
  const sale=sales.find(s=>s.id===id);
  if(sale){
    // Return qty to stock
    stock=stock.map(i=>i.id===sale.itemId?{...i,qty:i.qty+sale.qty}:i);
    // Remove debt from client if exists
    if(sale.clientId&&sale.debt>0){
      clients=clients.map(c=>c.id===sale.clientId?{...c,debt:Math.max(0,(c.debt||0)-sale.debt)}:c);
    }
  }
  sales=sales.filter(s=>s.id!==id);
  sv();
  showTab(ctab);
  toast('Продажа удалена, товар возвращён на склад!');
}

  if(salePrice<=0){alert(cu.role==='employee'?'Qiymət daxil edin':'Введите цену продажи');return;}
  const total=salePrice*_sq;
  const paid=_pt==='cash'?total:parseInt(document.getElementById('spaid')?.value||0);
  const debt=total-paid;
  let foundClient=clients.find(c=>c.name.toLowerCase()===cl.toLowerCase()||c.phone===cl);
  if(!foundClient){
    const nc={id:Date.now()+1,name:cl,phone:'',car:'',note:'',debt:0,createdAt:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})};
    clients.push(nc);foundClient=nc;
  }
  if(!foundClient.debt)foundClient.debt=0;
  foundClient.debt+=debt;
  clients=clients.map(c=>c.id===foundClient.id?foundClient:c);
  const saleDateInput=document.getElementById('sale-date');
  const saleDate=saleDateInput?new Date(saleDateInput.value).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}):new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
  sales.unshift({id:Date.now(),date:saleDate,
    itemId:_si.id,itemName:_si.name,qty:_sq,price:salePrice,
    costPrice:_si.cost||0,
    profit:(salePrice-(_si.cost||0))*_sq,
    total,paid,debt,
    payType:_pt,location:_saleLoc||'baku',employee:cu.name,client:cl,clientId:foundClient.id,status:'завершена'});
  stock=stock.map(i=>i.id===_si.id?{...i,qty:i.qty-_sq}:i);
  
  // Auto-create request if stock went low after sale
  const soldItem=stock.find(i=>i.id===_si.id);
  if(soldItem && soldItem.qty<=soldItem.minQty){
    const alreadyPending=requests.find(r=>r.itemId===soldItem.id&&r.status==='ожидает');
    if(!alreadyPending){
      requests.unshift({
        id:Date.now()+1,
        date:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),
        itemId:soldItem.id,
        itemName:soldItem.name,
        qty:Math.max(5,soldItem.minQty*3),
        employee:'Система',
        status:'ожидает',
        note:'⚠️ Автозаявка после продажи — остаток '+soldItem.qty+' шт.'
      });
    }
  }
  _si=null;_sq=1;_pt='cash';sv();
  toast(debt>0?'Продажа оформлена! Долг: '+debt.toLocaleString('ru')+' ₼':'Продажа успешно оформлена!');
  showTab(ctab);
}

    const parts=s.date.split('.');
    if(parts.length<2) return true;
    const sDate=new Date(now.getFullYear(),parseInt(parts[1])-1,parseInt(parts[0]));
    if(window._rp==='today') return sDate.toDateString()===now.toDateString();
    if(window._rp==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return sDate>=w;}

function importExcel(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(!rows.length)return alert('Файл пустой или неправильный формат');
      
      // Try to detect columns automatically
      const firstRow=rows[0];
      const keys=Object.keys(firstRow);
      
      // Find name column
      const nameKey=keys.find(k=>k.toLowerCase().includes('наз')||k.toLowerCase().includes('name')||k.toLowerCase().includes('товар')||k.toLowerCase().includes('стекл'))||keys[0];
      // Find qty column  
      const qtyKey=keys.find(k=>k.toLowerCase().includes('кол')||k.toLowerCase().includes('qty')||k.toLowerCase().includes('остат')||k.toLowerCase().includes('количеств'))||keys[2];
      // Find brand
      const brandKey=keys.find(k=>k.toLowerCase().includes('марк')||k.toLowerCase().includes('brand')||k.toLowerCase().includes('авто'));
      // Find price
      const priceKey=keys.find(k=>k.toLowerCase().includes('цен')||k.toLowerCase().includes('price')||k.toLowerCase().includes('продаж'));
      // Find cost
      const costKey=keys.find(k=>k.toLowerCase().includes('себ')||k.toLowerCase().includes('cost')||k.toLowerCase().includes('закуп'));
      // Find type/category
      const typeKey=keys.find(k=>k.toLowerCase().includes('тип')||k.toLowerCase().includes('катег')||k.toLowerCase().includes('type'));
      
      let added=0, skipped=0;
      const newItems=[];
      
      rows.forEach(row=>{
        const name=String(row[nameKey]||'').trim();
        if(!name||name.length<2){skipped++;return;}
        const qty=parseInt(row[qtyKey])||0;
        const brand=brandKey?String(row[brandKey]||'').trim():name.split(' ')[0];
        const price=priceKey?parseFloat(row[priceKey])||0:0;
        const cost=costKey?parseFloat(row[costKey])||0:0;
        const type=typeKey?String(row[typeKey]||'').trim():'Импорт';
        
        // Check if item already exists
        const exists=stock.find(i=>i.name.toLowerCase()===name.toLowerCase());
        if(exists){
          // Update quantity
          stock=stock.map(i=>i.name.toLowerCase()===name.toLowerCase()?{...i,qty:i.qty+qty}:i);
        }else{
          newItems.push({
            id:Date.now()+added,
            name,sku:'IMP-'+String(Date.now()+added).slice(-6),
            brand,type,qty,minQty:2,price,cost
          });
        }
        added++;
      });
      
      stock=[...stock,...newItems];
      sv();
      input.value='';
      showTab('stock');
      toast('Импорт завершён! Добавлено: '+newItems.length+' новых, обновлено: '+(added-newItems.length));
    }catch(err){
      alert('Ошибка чтения файла: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

  const lowItems=stock.filter(i=>i.qty<=i.minQty);

      requests.unshift({
        id:Date.now()+Math.random(),
        date:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),
        itemId:item.id,

        note:'⚠️ Остаток: '+item.qty+' шт. (мин. '+item.minQty+')'

    }
  });
  sv();

}

function applyPayment(clientId, currentDebt){
  const amt=Math.min(parseInt(document.getElementById('pay-amt').value)||0, currentDebt);
  if(amt<=0)return alert('Введите сумму');
  const note=document.getElementById('pay-note').value;
  clients=clients.map(c=>c.id===clientId?{...c,debt:Math.max(0,(c.debt||0)-amt)}:c);
  // Add payment record to sales as a payment entry
  const saleDateInput=document.getElementById('sale-date');
  const saleDate=saleDateInput?new Date(saleDateInput.value).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}):new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
  sales.unshift({id:Date.now(),date:saleDate,
    itemId:0,itemName:'Погашение долга'+(note?' ('+note+')':''),qty:1,price:amt,total:amt,paid:amt,debt:0,
    payType:'payment',employee:cu.name,client:clients.find(c=>c.id===clientId)?.name||'',clientId,status:'оплата'});
  sv();closeModal();
  toast('Оплата '+amt.toLocaleString('ru')+' ₼ принята!');
  showTab('clients');
}

let _purItem='', _purQty=1, _purPt='cash';
if(!window._pp) window._pp='month';
if(!window._pd1) window._pd1='';
if(!window._pd2) window._pd2='';

function rPurchases(){
  const now=new Date();
  const periods=[['today','Сегодня'],['week','Неделя'],['month','Месяц'],['all','Всё время'],['custom','📅 Период']];

  function inPeriod(dateStr){
    if(!dateStr) return true;
    const parts=dateStr.split('.');
    if(parts.length<2) return true;
    const d=new Date(now.getFullYear(),parseInt(parts[1])-1,parseInt(parts[0]));
    if(window._pp==='today') return d.toDateString()===now.toDateString();
    if(window._pp==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(window._pp==='month'){const m=new Date(now);m.setMonth(m.getMonth()-1);return d>=m;}
    if(window._pp==='all') return true;
    if(window._pp==='custom'){
      const d1=window._pd1?new Date(window._pd1):null;
      const d2=window._pd2?new Date(window._pd2):null;
      if(d1&&d<d1) return false;
      if(d2){const d2e=new Date(d2);d2e.setDate(d2e.getDate()+1);if(d>=d2e) return false;}
      return true;
    }
    return true;
  }

  const filtered=purchases.filter(p=>inPeriod(p.date));
  const totalSpent=filtered.reduce((a,p)=>a+(p.totalCost||0),0);
  const totalDebt=purchases.reduce((a,p)=>a+(p.debt||0),0);

  let h=`<div class="fr" style="margin-bottom:10px">
    ${periods.map(([id,lb])=>`<button class="chip${window._pp===id?' active':''}" onclick="window._pp='${id}';refreshPurchases()">${lb}</button>`).join('')}

  ${window._pp==='custom'?`<div style="display:flex;gap:10px;padding:0 16px;margin-bottom:14px">
    <div style="flex:1"><div class="lbl" style="margin-bottom:6px">С даты</div>
      <input type="date" class="inp" style="margin-bottom:0;padding:10px 12px" value="${window._pd1||''}" onchange="window._pd1=this.value;refreshPurchases()"/>
    </div>
    <div style="flex:1"><div class="lbl" style="margin-bottom:6px">По дату</div>
      <input type="date" class="inp" style="margin-bottom:0;padding:10px 12px" value="${window._pd2||''}" onchange="window._pd2=this.value;refreshPurchases()"/>
    </div>
  </div>`:''}`;

  // Stats
  h+=`<div class="sg">
    <div class="sc full" style="border-color:rgba(240,180,41,0.25)">
      <div class="sl">Потрачено на закупки</div>
      <div class="sv" style="color:#F0B429">${totalSpent.toLocaleString('ru')} ₼</div>
      <div class="sn">${filtered.length} закупок за период</div>
    </div>
    ${totalDebt>0?`<div class="sc full" style="border-color:rgba(240,82,82,0.25)">
      <div class="sl">Долг поставщикам</div>
      <div class="sv" style="color:#F05252">${totalDebt.toLocaleString('ru')} ₼</div>
    </div>`:''}
  </div>`;

  // New purchase form
  h+=`<div class="card" style="border-color:rgba(240,180,41,0.2)">
    <div class="ct">Новая закупка</div>
    <div class="fg"><label class="lbl">Товар (название)</label>
      <input class="inp" id="pur-item" placeholder="Напр: Лобовое BMW 5 Series" list="stock-list-dl"/>
      <datalist id="stock-list-dl">${stock.map(i=>`<option value="${i.name}">`).join('')}</datalist>
    </div>
    <div class="fg"><label class="lbl">Поставщик</label>
      <input class="inp" id="pur-supplier" placeholder="Название склада/поставщика"/>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="fg"><label class="lbl">Количество</label>
        <input class="inp" id="pur-qty" type="number" value="1" min="1"/>
      </div>
      <div class="fg"><label class="lbl">Цена за ед. (₼)</label>
        <input class="inp" id="pur-price" type="number" placeholder="0"/>
      </div>
    </div>
    <div class="fg"><label class="lbl">Тип оплаты</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button id="ppt-cash" class="btn bp" onclick="setPurPT('cash')" style="padding:10px">💵 Наличные</button>
        <button id="ppt-debt" class="btn bd2" onclick="setPurPT('debt')" style="padding:10px;background:rgba(240,82,82,0.15)">📋 В долг</button>
      </div>
    </div>
    <div class="fg hidden" id="pur-paid-wrap"><label class="lbl">Оплачено сейчас (₼)</label>
      <input class="inp" id="pur-paid" type="number" placeholder="0" value="0"/>
    </div>
    <div class="fg"><label class="lbl">Заметка</label>
      <input class="inp" id="pur-note" placeholder="Необязательно"/>
    </div>
    <button class="btn bf" style="background:linear-gradient(135deg,#F0B429,#c8941f);color:#fff;padding:15px" onclick="addPurchase()">🛒 Добавить закупку</button>
  </div>`;

  // Purchase history
  h+=`<div class="sh">История закупок</div>`;
  if(!filtered.length){
    h+=`<div class="empty"><div class="ei">🛒</div><div>Закупок нет</div></div>`;

    h+=`<div class="card" style="padding:4px 18px">`;

      h+=`<div class="ir">

function deletePurchase(id){
  if(!confirm('Удалить закупку?')) return;
  const p=purchases.find(x=>x.id===id);
  if(p){
    // Remove from stock
    stock=stock.map(i=>i.name.toLowerCase()===p.itemName.toLowerCase()?{...i,qty:Math.max(0,i.qty-p.qty)}:i);
    // Remove from expenses if was cash
    if(p.paid>0){
      expenses=expenses.filter(e=>!(e.type==='purchase'&&e.desc&&e.desc.includes(p.itemName)&&e.amount===p.paid));
    }
  }
  purchases=purchases.filter(x=>x.id!==id);
  sv();
  showTab('purchases');
  toast('Закупка удалена!');
}
function setPurPT(t){

function addPurchase(){
  const itemName=document.getElementById('pur-item')?.value?.trim();
  const supplier=document.getElementById('pur-supplier')?.value?.trim()||'';
  const qty=parseInt(document.getElementById('pur-qty')?.value)||1;
  const unitPrice=parseInt(document.getElementById('pur-price')?.value)||0;
  const note=document.getElementById('pur-note')?.value||'';
  const totalCost=unitPrice*qty;
  const paid=_purPt==='cash'?totalCost:parseInt(document.getElementById('pur-paid')?.value||0);
  const debt=totalCost-paid;

  if(!itemName)return alert('Введите название товара');

  // Add to purchases history
  purchases.unshift({
    id:Date.now(),
    date:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),
    itemName, supplier, qty, unitPrice, totalCost,
    payType:_purPt, paid, debt, note,
    employee:cu.name
  });

  // Update stock quantity and cost price
  const existing=stock.find(i=>i.name.toLowerCase()===itemName.toLowerCase());
  if(existing){
    // Update cost price (weighted average)
    const oldCost=existing.cost||0;
    const oldQty=existing.qty||0;
    const newCost=oldQty>0?Math.round((oldCost*oldQty+unitPrice*qty)/(oldQty+qty)):unitPrice;
    stock=stock.map(i=>i.name.toLowerCase()===itemName.toLowerCase()?{...i,qty:i.qty+qty,cost:newCost}:i);
  }else{
    // Add new item to stock
    stock.push({
      id:Date.now()+1,
      name:itemName,
      sku:'PUR-'+String(Date.now()).slice(-5),
      brand:itemName.split(' ')[0],
      type:'Fiolet',
      qty, minQty:3,
      price:0,
      cost:unitPrice
    });
  }

  // Remove request if exists
  requests=requests.map(r=>r.itemName.toLowerCase()===itemName.toLowerCase()&&r.status==='ожидает'?{...r,status:'одобрено'}:r);

  // Deduct paid amount from cash as expense
  if(paid>0){
    expenses.unshift({
      id:Date.now()+2,
      date:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),
      type:'purchase',
      amount:paid,
      desc:'Закупка: '+itemName+(supplier?' ('+supplier+')':''),
      employee:cu.name
    });
  }

  sv();
  showTab('purchases');
  toast('Закупка добавлена! Касса уменьшена на '+paid.toLocaleString('ru')+' ₼');
}

    if(!dateStr) return true;

    if(window._cp==='today') return d.toDateString()===now.toDateString();
    if(window._cp==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(window._cp==='month'){const m=new Date(now);m.setMonth(m.getMonth()-1);return d>=m;}

      return true;

  // Calculate cash from sales and services filtered by period
  const allIncome=[...sales,...services].filter(s=>(s.status==='завершена'||s.status==='оплата'||s.price>0)&&inPeriod(s.date));

  const barterTotal=allIncome.filter(s=>s.location==='barter').reduce((a,s)=>a+(s.total||s.price||0),0);
  const regionTotal=allIncome.filter(s=>s.location==='region').reduce((a,s)=>a+(s.total||s.price||0),0);
  // Subtract expenses from cash

function exportCustom(){
  const now=new Date();

  // Get filtered sales based on current period
  function inPeriod(dateStr){
    if(!dateStr) return true;
    const parts=dateStr.split('.');
    if(parts.length<2) return true;
    const d=new Date(now.getFullYear(),parseInt(parts[1])-1,parseInt(parts[0]));
    if(window._rp==='today') return d.toDateString()===now.toDateString();
    if(window._rp==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(window._rp==='month'){const m=new Date(now);m.setMonth(m.getMonth()-1);return d>=m;}
    if(window._rp==='all') return true;
    if(window._rp==='custom'){
      const d1=window._rd1?new Date(window._rd1):null;
      const d2=window._rd2?new Date(window._rd2):null;
      if(d1&&d<d1) return false;
      if(d2){const d2e=new Date(d2);d2e.setDate(d2e.getDate()+1);if(d>=d2e) return false;}
      return true;
    }
    return true;
  }

  const done=sales.filter(s=>s.status==='завершена'&&inPeriod(s.date));
  const wb=XLSX.utils.book_new();
  let sheetCount=0;

  // 1. Sales
  if(document.getElementById('exp-sales')?.checked){
    const rows=done.sort((a,b)=>a.date.localeCompare(b.date)).map(s=>({
      'Дата':s.date,'Модель':s.itemName,'Клиент':s.client||'',
      'Сотрудник':s.employee||'','Кол-во':s.qty||1,
      'Цена (₼)':s.price||0,'Сумма (₼)':s.total||0,
      'Себест. (₼)':(s.costPrice||0)*(s.qty||1),
      'Прибыль (₼)':s.profit||0,
      'Оплачено (₼)':s.paid||s.total||0,'Долг (₼)':s.debt||0,
      'Локация':s.location==='region'?'Регион':s.location==='barter'?'Бартер':'Баку'
    }));
    const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'Нет данных':''}]);
    ws['!cols']=[{wch:8},{wch:32},{wch:18},{wch:16},{wch:8},{wch:10},{wch:12},{wch:12},{wch:12},{wch:12},{wch:10},{wch:10}];
    XLSX.utils.book_append_sheet(wb,ws,'Продажи');sheetCount++;
  }

  // 2. Models
  if(document.getElementById('exp-models')?.checked){
    const byModel={};
    done.forEach(s=>{
      if(!byModel[s.itemName]) byModel[s.itemName]={qty:0,rev:0,profit:0,cost:0};
      byModel[s.itemName].qty+=s.qty||1;
      byModel[s.itemName].rev+=s.total||0;
      byModel[s.itemName].profit+=s.profit||0;
      byModel[s.itemName].cost+=(s.costPrice||0)*(s.qty||1);
    });
    const rows=Object.entries(byModel).sort((a,b)=>b[1].qty-a[1].qty).map(([name,d],i)=>{
      const si=stock.find(s=>s.name.toLowerCase()===name.toLowerCase());

      return {'Имя':c.name,'Телефон':c.phone||'',
        'Покупок':cs.length,'Сумма (₼)':cs.reduce((a,s)=>a+s.total,0),
        'Долг (₼)':c.debt||0,'Заметка':c.note||''};
    }).sort((a,b)=>b['Долг (₼)']-a['Долг (₼)']);
    const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'Нет данных':''}]);

    XLSX.utils.book_append_sheet(wb,ws,'Клиенты');sheetCount++;

  if(document.getElementById('exp-expenses')?.checked){
    const typeNames={salary:'Зарплата',rent:'Аренда',purchase:'Закупка',brak:'Брак',other:'Другое'};
    const rows=expenses.filter(e=>inPeriod(e.date)).map(e=>({

    }));
    const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'Нет данных':''}]);
    ws['!cols']=[{wch:10},{wch:14},{wch:12},{wch:35},{wch:18}];
    XLSX.utils.book_append_sheet(wb,ws,'Расходы');sheetCount++;
  }

  // 6. Cash transfers
  if(document.getElementById('exp-cash')?.checked){
    const rows=cashTransfers.filter(c=>inPeriod(c.date)).map(c=>({
      'Дата':c.date,'Сотрудник':c.employee,'Сдано (₼)':c.amount,'Заметка':c.note||''
    }));
    const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'Нет данных':''}]);
    ws['!cols']=[{wch:10},{wch:20},{wch:14},{wch:30}];

  if(document.getElementById('exp-purchases')?.checked){
    const rows=purchases.filter(p=>inPeriod(p.date)).map(p=>({
      'Дата':p.date,'Товар':p.itemName,'Поставщик':p.supplier||'',
      'Кол-во':p.qty,'Цена за ед. (₼)':p.unitPrice||0,

    }));

  else periodLabel='Все';

  XLSX.writeFile(wb,'AutoGlass_'+periodLabel+'_'+today()+'.xlsx');

function exportModels(){
  // Get current filtered sales
  const now=new Date();
  const done=sales.filter(s=>{
    if(s.status!=='завершена') return false;
    // Location filter
    if(window._rloc&&window._rloc!=='all'){
      const loc=s.location||'baku';
      if(loc!==window._rloc) return false;
    }
    // Category filter
    if(window._rcat&&window._rcat!=='Все категории'){
      const si=stock.find(i=>i.id===s.itemId||i.name.toLowerCase()===s.itemName.toLowerCase());
      if(!si||si.type!==window._rcat) return false;
    }
    const parts=s.date.split('.');
    if(parts.length<2) return true;
    const d=new Date(now.getFullYear(),parseInt(parts[1])-1,parseInt(parts[0]));
    if(window._rp==='today') return d.toDateString()===now.toDateString();
    if(window._rp==='week'){const w=new Date(now);w.setDate(w.getDate()-7);return d>=w;}
    if(window._rp==='month'){const m=new Date(now);m.setMonth(m.getMonth()-1);return d>=m;}
    if(window._rp==='all') return true;
    if(window._rp==='custom'){
      const d1=window._rd1?new Date(window._rd1):null;
      const d2=window._rd2?new Date(window._rd2):null;
      if(d1&&d<d1) return false;
      if(d2){const d2e=new Date(d2);d2e.setDate(d2e.getDate()+1);if(d>=d2e) return false;}
      return true;
    }
    return true;
  });

  if(!done.length){toast('Нет данных для выгрузки');return;}

  // Build model stats
  const byModel={};
  done.forEach(s=>{
    const key=s.itemName;
    if(!byModel[key]) byModel[key]={qty:0,rev:0,profit:0,cost:0,sales:[]};
    byModel[key].qty+=s.qty||1;
    byModel[key].rev+=s.total||0;
    byModel[key].profit+=s.profit||0;
    byModel[key].cost+=((s.costPrice||0)*(s.qty||1));
    byModel[key].sales.push(s);
  });

  const sorted=Object.entries(byModel).sort((a,b)=>b[1].qty-a[1].qty);

  // Sheet 1 - Summary by model
  const summaryRows=sorted.map(([name,d],i)=>{
    const si=stock.find(s=>s.name.toLowerCase()===name.toLowerCase());
    const sq=si?si.qty:0;
    return {
      '№':i+1,
      'Модель':name,
      'Продано (шт.)':d.qty,
      'Остаток на складе':sq,
      'Статус':sq===0?'Нет':sq<=3?'Мало':'В наличии',
      'Выручка (₼)':d.rev,
      'Себестоимость (₼)':d.cost,
      'Прибыль (₼)':d.profit,
      'Маржа %':d.rev>0?Math.round(d.profit/d.rev*100):0
    };
  });

  // Sheet 2 - All sales with dates
  const detailRows=done.sort((a,b)=>a.date.localeCompare(b.date)).map(s=>({
    'Дата':s.date,
    'Модель':s.itemName,
    'Клиент':s.client||'',
    'Сотрудник':s.employee||'',
    'Кол-во':s.qty||1,
    'Цена (₼)':s.price||0,
    'Сумма (₼)':s.total||0,
    'Себест. (₼)':(s.costPrice||0)*(s.qty||1),
    'Прибыль (₼)':s.profit||0,
    'Оплачено (₼)':s.paid||s.total||0,
    'Долг (₼)':s.debt||0,
    'Локация':s.location==='region'?'Регион':s.location==='barter'?'Бартер':'Баку'
  }));

  const wb=XLSX.utils.book_new();

  // Summary sheet
  const ws1=XLSX.utils.json_to_sheet(summaryRows);
  ws1['!cols']=[{wch:4},{wch:35},{wch:14},{wch:16},{wch:12},{wch:14},{wch:16},{wch:14},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws1,'По моделям');

  // Detail sheet
  const ws2=XLSX.utils.json_to_sheet(detailRows);
  ws2['!cols']=[{wch:8},{wch:35},{wch:18},{wch:16},{wch:8},{wch:10},{wch:12},{wch:12},{wch:12},{wch:12},{wch:10},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws2,'Детальные продажи');

  // Period label for filename
  let periodLabel='';
  if(window._rp==='today') periodLabel='Сегодня';
  else if(window._rp==='week') periodLabel='Неделя';
  else if(window._rp==='month') periodLabel='Месяц';
  else if(window._rp==='custom') periodLabel=(window._rd1||'')+'_'+(window._rd2||'');
  else periodLabel='Все';

  XLSX.writeFile(wb,'AutoGlass_Модели_'+periodLabel+'_'+today()+'.xlsx');
  toast('Выгружено '+sorted.length+' моделей, '+done.length+' продаж!');
}

function addService(){
  const client=document.getElementById('svc-client')?.value?.trim();
  const price=parseInt(document.getElementById('svc-price')?.value)||0;
  const note=document.getElementById('svc-note')?.value||'';
  if(!client) return alert(cu.role==='employee'?'Müştəri göstərin':'Укажите клиента');
  if(!window._svType) return alert('Выберите тип услуги');
  services.unshift({
    id:Date.now(),
    date:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),
    type:window._svType,
    client, price, note,
    employee:cu.name,
    status:'завершена'
  });
  // Add client if not exists
  const found=clients.find(c=>c.name.toLowerCase()===client.toLowerCase());
  if(!found){
    clients.push({id:Date.now()+1,name:client,phone:'',car:'',note:'',debt:0,
      createdAt:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'})});
  }
  sv();
  toast('Услуга оформлена! '+price.toLocaleString('ru')+' ₼');
  showTab('services');
}

        <button class="stb" onclick="adjQ(-1,'brak-qty')">−</button>
        <div class="stv" id="brak-qty">1</div>
        <button class="stb" onclick="adjQ(1,'brak-qty')">+</button>
      </div>
    </div>
    <div class="fg"><label class="lbl">Причина</label>
      <input class="inp" id="brak-reason" placeholder="Причина списания..."/>
    </div>
    <button class="btn bf" style="background:linear-gradient(135deg,#F05252,#c03030);color:#fff;padding:15px" onclick="writeBrak(${item.id})">⚠️ Списать с склада</button>`;
  openModal();
}

function writeBrak(itemId){
  const qty=parseInt(document.getElementById('brak-qty')?.textContent)||1;
  const reason=document.getElementById('brak-reason')?.value||'Брак';
  const item=stock.find(i=>i.id===itemId);
  if(!item) return;
  if(qty>item.qty){alert('Нельзя списать больше чем есть на складе');return;}
  
  // Reduce stock
  stock=stock.map(i=>i.id===itemId?{...i,qty:i.qty-qty}:i);
  
  // Add to expenses as write-off
  expenses.unshift({
    id:Date.now(),
    date:new Date().toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}),
    type:'brak',
    amount:0,
    desc:'Брак: '+item.name+' — '+qty+' шт. ('+reason+')',
    employee:cu.name
  });
  
  sv();
  closeModal();
  showTab('stock');
  toast('Списано '+qty+' шт. брака: '+item.name);
}

function openModal(){document.getElementById('ov').classList.add('open');}
function closeModal(e){if(!e||e.target===document.getElementById('ov'))document.getElementById('ov').classList.remove('open');}
function toast(msg){const a=document.createElement('div');a.className='al al-g';a.style.cssText='position:fixed;top:20px;left:16px;right:16px;z-index:300;font-size:14px';a.textContent='✅ '+msg;document.body.appendChild(a);setTimeout(()=>a.remove(),2500);}
</script>
</body>
</html>
